name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Stylelint
        run: npm run stylelint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build

      - name: Check bundle size (budget gate)
        env:
          BUNDLE_LIMIT_MB: 5
        run: npm run check:bundle

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          NODE_ENV: test

      - name: Run E2E smoke tests
        run: npx playwright test --grep="@smoke" --project=chromium
        env:
          NODE_ENV: test

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3

  notify:
    name: Send DingTalk Notification
    runs-on: ubuntu-latest
    needs: [lint, test, build, security, e2e-smoke]
    if: always()
    steps:
      - name: Send DingTalk notification
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🔍 开始钉钉通知流程...');
            console.log('环境变量检查:');
            console.log('- DINGTALK_WEBHOOK:', process.env.DINGTALK_WEBHOOK ? '已配置' : '未配置');
            
            const webhook = process.env.DINGTALK_WEBHOOK;
            if (!webhook) {
              console.log('❌ 钉钉webhook未配置，请在GitHub Secrets中添加DINGTALK_WEBHOOK');
              console.log('💡 配置步骤: Settings → Secrets and variables → Actions → New repository secret');
              return;
            }
            
            // 验证webhook格式
            if (!webhook.includes('oapi.dingtalk.com')) {
              console.log('⚠️ Webhook地址格式可能不正确，请确认是钉钉机器人的webhook地址');
            }
            
            const lintResult = '${{ needs.lint.result }}';
            const testResult = '${{ needs.test.result }}';
            const buildResult = '${{ needs.build.result }}';
            const securityResult = '${{ needs.security.result }}';
            const e2eSmokeResult = '${{ needs.e2e-smoke.result }}';
            
            const allSuccess = [lintResult, testResult, buildResult, securityResult, e2eSmokeResult].every(result => result === 'success');
            const hasFailure = [lintResult, testResult, buildResult, securityResult, e2eSmokeResult].some(result => result === 'failure');
            
            let status, emoji;
            if (allSuccess) {
              status = '✅ 所有检查通过';
              emoji = '✅';
            } else if (hasFailure) {
              status = '❌ 检查失败';
              emoji = '❌';
            } else {
              status = '⚠️ 检查部分完成';
              emoji = '⚠️';
            }
            
            const message = {
              msgtype: "text",
              text: {
                content: `GitHub CI 部署 监控 通知\n\n` +
                        `${emoji} CI检查完成\n\n` +
                        `项目: ${context.repo.repo}\n` +
                        `分支: ${context.ref.replace('refs/heads/', '')}\n` +
                        `提交: ${context.sha.substring(0, 7)}\n\n` +
                        `检查结果:\n` +
                        `- 代码检查: ${lintResult === 'success' ? '✅' : '❌'} ${lintResult}\n` +
                        `- 单元测试: ${testResult === 'success' ? '✅' : '❌'} ${testResult}\n` +
                        `- 构建测试: ${buildResult === 'success' ? '✅' : '❌'} ${buildResult}\n` +
                        `- 安全检查: ${securityResult === 'success' ? '✅' : '❌'} ${securityResult}\n` +
                        `- E2E冒烟测试: ${e2eSmokeResult === 'success' ? '✅' : '❌'} ${e2eSmokeResult}\n\n` +
                        `总体状态: ${status}\n` +
                        `时间: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}\n` +
                        `详情: https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
              }
            };
            
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
              });
              
              if (response.ok) {
                console.log('钉钉CI通知发送成功');
              } else {
                console.log('钉钉CI通知发送失败:', response.status);
              }
            } catch (error) {
              console.log('钉钉CI通知发送错误:', error.message);
            }
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

