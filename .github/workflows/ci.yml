name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Stylelint
        run: npm run stylelint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build

      - name: Check bundle size (budget gate)
        env:
          BUNDLE_LIMIT_MB: 5
        run: npm run check:bundle

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate

  notify:
    name: Send DingTalk Notification
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    steps:
      - name: Send DingTalk notification
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.DINGTALK_WEBHOOK;
            if (!webhook) {
              console.log('钉钉webhook未配置，跳过通知');
              return;
            }
            
            const lintResult = '${{ needs.lint.result }}';
            const testResult = '${{ needs.test.result }}';
            const buildResult = '${{ needs.build.result }}';
            const securityResult = '${{ needs.security.result }}';
            
            const allSuccess = [lintResult, testResult, buildResult, securityResult].every(result => result === 'success');
            const hasFailure = [lintResult, testResult, buildResult, securityResult].some(result => result === 'failure');
            
            let status, emoji;
            if (allSuccess) {
              status = '✅ 所有检查通过';
              emoji = '✅';
            } else if (hasFailure) {
              status = '❌ 检查失败';
              emoji = '❌';
            } else {
              status = '⚠️ 检查部分完成';
              emoji = '⚠️';
            }
            
            const message = {
              msgtype: "text",
              text: {
                content: `${emoji} CI检查完成\n\n` +
                        `项目: ${context.repo.repo}\n` +
                        `分支: ${context.ref.replace('refs/heads/', '')}\n` +
                        `提交: ${context.sha.substring(0, 7)}\n\n` +
                        `检查结果:\n` +
                        `- 代码检查: ${lintResult === 'success' ? '✅' : '❌'} ${lintResult}\n` +
                        `- 单元测试: ${testResult === 'success' ? '✅' : '❌'} ${testResult}\n` +
                        `- 构建测试: ${buildResult === 'success' ? '✅' : '❌'} ${buildResult}\n` +
                        `- 安全检查: ${securityResult === 'success' ? '✅' : '❌'} ${securityResult}\n\n` +
                        `总体状态: ${status}\n` +
                        `时间: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}\n` +
                        `详情: https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
              }
            };
            
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
              });
              
              if (response.ok) {
                console.log('钉钉CI通知发送成功');
              } else {
                console.log('钉钉CI通知发送失败:', response.status);
              }
            } catch (error) {
              console.log('钉钉CI通知发送错误:', error.message);
            }
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

