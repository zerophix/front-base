name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: |
          npm run lint
          npm run stylelint

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # 生产环境部署
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            # 预览环境部署
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "deployment_url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 部署完成！预览链接：${{ steps.deploy.outputs.deployment_url }}`
            })

      - name: Update deployment status
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ 生产环境部署成功！"
          echo "🌐 访问链接：${{ steps.deploy.outputs.deployment_url }}"

      - name: Send DingTalk notification on success
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('开始发送钉钉通知...');
            console.log('当前步骤状态:', '${{ job.status }}');
            console.log('GitHub ref:', '${{ github.ref }}');
            
            const webhook = process.env.DINGTALK_WEBHOOK;
            console.log('Webhook配置状态:', webhook ? '已配置' : '未配置');
            
            if (!webhook) {
              console.log('❌ 钉钉webhook未配置，请在GitHub Secrets中添加DINGTALK_WEBHOOK');
              return;
            }
            
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}' || '部署链接获取失败';
            const isProduction = '${{ github.ref }}' === 'refs/heads/main';
            const environment = isProduction ? '生产环境' : '预览环境';
            const jobStatus = '${{ job.status }}';
            
            console.log('部署URL:', deploymentUrl);
            console.log('环境:', environment);
            console.log('任务状态:', jobStatus);
            
            // 根据任务状态决定消息内容
            let title, emoji;
            if (jobStatus === 'success') {
              title = `🚀 ${environment}部署成功`;
              emoji = '✅';
            } else if (jobStatus === 'failure') {
              title = `❌ ${environment}部署失败`;
              emoji = '❌';
            } else {
              title = `⚠️ ${environment}部署状态: ${jobStatus}`;
              emoji = '⚠️';
            }
            
            const message = {
              msgtype: "text",
              text: {
                content: `${emoji} ${title}\n\n` +
                        `项目: ${context.repo.repo}\n` +
                        `分支: ${context.ref.replace('refs/heads/', '')}\n` +
                        `提交: ${context.sha.substring(0, 7)}\n` +
                        `状态: ${jobStatus}\n` +
                        `时间: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}\n` +
                        (deploymentUrl !== '部署链接获取失败' ? `链接: ${deploymentUrl}\n` : '') +
                        `详情: https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
              }
            };
            
            console.log('发送消息内容:', JSON.stringify(message, null, 2));
            
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
              });
              
              console.log('HTTP响应状态:', response.status);
              const responseText = await response.text();
              console.log('响应内容:', responseText);
              
              if (response.ok) {
                console.log('✅ 钉钉通知发送成功');
              } else {
                console.log('❌ 钉钉通知发送失败:', response.status, responseText);
              }
            } catch (error) {
              console.log('❌ 钉钉通知发送错误:', error.message);
              console.log('错误详情:', error);
            }
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}