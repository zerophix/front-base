name: Deployment Notification

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: |
          npm run lint
          npm run stylelint

      - name: Build check
        run: npm run build

      - name: Deployment notification
        run: |
          echo "✅ 代码质量检查通过！"
          echo "🚀 Vercel将自动部署此次提交"
          echo "📝 提交信息: ${{ github.event.head_commit.message }}"

      - name: Send DingTalk notification on success
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('开始发送钉钉通知...');
            console.log('当前步骤状态:', '${{ job.status }}');
            console.log('GitHub ref:', '${{ github.ref }}');
            
            const webhook = process.env.DINGTALK_WEBHOOK;
            console.log('Webhook配置状态:', webhook ? '已配置' : '未配置');
            
            if (!webhook) {
              console.log('❌ 钉钉webhook未配置，请在GitHub Secrets中添加DINGTALK_WEBHOOK');
              return;
            }
            
            const isProduction = '${{ github.ref }}' === 'refs/heads/main';
            const environment = isProduction ? '生产环境' : '预览环境';
            const jobStatus = '${{ job.status }}';
            const commitMessage = '${{ github.event.head_commit.message }}';
            
            console.log('环境:', environment);
            console.log('任务状态:', jobStatus);
            console.log('提交信息:', commitMessage);
            
            // 根据任务状态决定消息内容
            let title, emoji;
            if (jobStatus === 'success') {
              title = `🚀 代码质量检查通过，${environment}准备部署`;
              emoji = '✅';
            } else if (jobStatus === 'failure') {
              title = `❌ 代码质量检查失败`;
              emoji = '❌';
            } else {
              title = `⚠️ 代码检查状态: ${jobStatus}`;
              emoji = '⚠️';
            }
            
            const message = {
              msgtype: "text",
              text: {
                content: `GitHub CI 监控通知\n\n` +
                        `${emoji} ${title}\n\n` +
                        `项目: ${context.repo.repo}\n` +
                        `分支: ${context.ref.replace('refs/heads/', '')}\n` +
                        `提交: ${context.sha.substring(0, 7)}\n` +
                        `信息: ${commitMessage}\n` +
                        `状态: ${jobStatus}\n` +
                        `时间: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}\n` +
                        (jobStatus === 'success' ? `🔄 Vercel将自动部署此次提交\n` : '') +
                        `详情: https://github.com/${context.repo.owner}/${context.repo.repo}/actions`
              }
            };
            
            console.log('发送消息内容:', JSON.stringify(message, null, 2));
            
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
              });
              
              console.log('HTTP响应状态:', response.status);
              const responseText = await response.text();
              console.log('响应内容:', responseText);
              
              if (response.ok) {
                console.log('✅ 钉钉通知发送成功');
              } else {
                console.log('❌ 钉钉通知发送失败:', response.status, responseText);
              }
            } catch (error) {
              console.log('❌ 钉钉通知发送错误:', error.message);
              console.log('错误详情:', error);
            }
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}