name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: |
          npm run lint
          npm run stylelint

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # 生产环境部署
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            # 预览环境部署
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "deployment_url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 部署完成！预览链接：${{ steps.deploy.outputs.deployment_url }}`
            })

      - name: Update deployment status
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ 生产环境部署成功！"
          echo "🌐 访问链接：${{ steps.deploy.outputs.deployment_url }}"

      - name: Send DingTalk notification on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.DINGTALK_WEBHOOK;
            if (!webhook) {
              console.log('钉钉webhook未配置，跳过通知');
              return;
            }
            
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const isProduction = '${{ github.ref }}' === 'refs/heads/main';
            const environment = isProduction ? '生产环境' : '预览环境';
            
            const message = {
              msgtype: "markdown",
              markdown: {
                title: `🚀 ${environment}部署成功`,
                text: `### 🚀 ${environment}部署成功\n\n` +
                      `**项目**: ${context.repo.repo}\n` +
                      `**分支**: ${context.ref.replace('refs/heads/', '')}\n` +
                      `**提交**: [${context.sha.substring(0, 7)}](${context.payload.head_commit?.url || ''})\n` +
                      `**提交信息**: ${context.payload.head_commit?.message || ''}\n` +
                      `**部署链接**: [点击访问](${deploymentUrl})\n` +
                      `**部署时间**: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}`
              }
            };
            
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
              });
              
              if (response.ok) {
                console.log('钉钉通知发送成功');
              } else {
                console.log('钉钉通知发送失败:', response.status);
              }
            } catch (error) {
              console.log('钉钉通知发送错误:', error.message);
            }
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

      - name: Send DingTalk notification on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.DINGTALK_WEBHOOK;
            if (!webhook) {
              console.log('钉钉webhook未配置，跳过通知');
              return;
            }
            
            const message = {
              msgtype: "markdown",
              markdown: {
                title: "❌ 部署失败",
                text: `### ❌ 部署失败\n\n` +
                      `**项目**: ${context.repo.repo}\n` +
                      `**分支**: ${context.ref.replace('refs/heads/', '')}\n` +
                      `**提交**: [${context.sha.substring(0, 7)}](${context.payload.head_commit?.url || ''})\n` +
                      `**提交信息**: ${context.payload.head_commit?.message || ''}\n` +
                      `**失败时间**: ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}\n` +
                      `**查看详情**: [GitHub Actions](${context.payload.repository?.html_url}/actions)`
              }
            };
            
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
              });
              
              if (response.ok) {
                console.log('钉钉失败通知发送成功');
              } else {
                console.log('钉钉失败通知发送失败:', response.status);
              }
            } catch (error) {
              console.log('钉钉失败通知发送错误:', error.message);
            }
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}